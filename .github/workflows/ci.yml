name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを避ける（実行中のデプロイはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        # ビルドツール未導入のため、index.html と src/ 配下を丸ごと _site へ集約する。
        # src/ 配下にファイルが増えても個別の追記は不要（*.test.js のみ除外）。
        # 将来バンドラー（Vite等）を導入したら、このステップは `npm run build` の
        # 出力(dist等)を _site としてアップロードする形に置き換える。
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/src
          find _site/src -type f -name '*.test.js' -delete

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
